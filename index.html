<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartford Logic LLC</title>

<style>
body {
    margin: 0;
    background: #0b0b0d;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 800px;
    padding: 40px;
}

.logo {
    width: 260px;
    margin-bottom: 30px;
}

.badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #9fd3ff;
    font-size: 0.9rem;
    margin-bottom: 25px;
}

h1 {
    font-size: 2.4rem;
    font-weight: 600;
    margin-bottom: 10px;
}

.tagline {
    font-size: 1.2rem;
    color: #a0a0a0;
    margin-bottom: 30px;
    line-height: 1.5;
}

.footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo" alt="Hartford Logic Logo">

    <!-- STATUS BADGE -->
    <div class="badge">Private Development Underway</div>

    <!-- HEADLINE -->
    <h1>Structured Systems.<br>Defensible Logic.</h1>

    <!-- DESCRIPTION -->
    <div class="tagline">
        Advanced systems research and development focused on verification frameworks,
        resilient architectures, and structured analysis technologies.
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Hartford Logic LLC
    </div>

</div>

</body>
</html>

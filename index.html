<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hartford Logic LLC</title>

<style>
:root {
  --bg: #050505;
  --panel: #090807;
  --gold: #c9a66b;
  --gold-soft: #ead8ad;
  --text: #f4efe4;
  --muted: #aaa198;
  --line: rgba(201,166,107,.28);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 18%, rgba(201,166,107,.16), transparent 28%),
    linear-gradient(180deg, #070707 0%, #020202 100%);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 44px 18px;
}

.card {
  width: min(760px, 100%);
  padding: clamp(28px, 6vw, 56px);
  border: 1px solid var(--line);
  border-radius: 30px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.008)),
    rgba(6,6,6,.92);
  box-shadow: 0 30px 90px rgba(0,0,0,.7);
  text-align: center;
}

.logo-wrap {
  width: min(360px, 76vw);
  margin: 0 auto 28px;
}

.logo {
  width: 100%;
  display: block;
  border-radius: 18px;
  box-shadow: 0 0 44px rgba(201,166,107,.14);
}

.badge {
  display: inline-block;
  margin: 6px 0 34px;
  padding: 12px 22px;
  border: 1px solid rgba(201,166,107,.38);
  border-radius: 999px;
  color: var(--gold-soft);
  background: rgba(201,166,107,.055);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: .76rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(2.55rem, 10vw, 5rem);
  line-height: .92;
  font-weight: 500;
  letter-spacing: -.055em;
}

h1 span {
  color: var(--gold-soft);
}

.rule {
  width: min(240px, 62%);
  height: 1px;
  margin: 36px auto 28px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.copy {
  max-width: 650px;
  margin: 0 auto;
  color: var(--muted);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: clamp(1rem, 3.6vw, 1.18rem);
  line-height: 1.6;
}

.footer {
  margin-top: 36px;
  color: #6f675e;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: .82rem;
  letter-spacing: .04em;
}

@media (max-width: 520px) {
  .page {
    align-items: flex-start;
    padding: 26px 14px;
  }

  .card {
    border-radius: 24px;
    padding: 28px 20px 34px;
  }

  .logo-wrap {
    width: min(300px, 82vw);
    margin-bottom: 24px;
  }

  .badge {
    margin-bottom: 30px;
    padding: 11px 18px;
    font-size: .7rem;
    letter-spacing: .14em;
  }

  h1 {
    font-size: clamp(2.75rem, 13vw, 4.1rem);
  }

  .copy {
    font-size: 1rem;
  }
}
</style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="logo-wrap">
        <img src="logo.png?v=4" class="logo" alt="Hartford Logic LLC logo">
      </div>

      <div class="badge">Private Development Underway</div>

      <h1>
        Structured<br>
        Systems.<br>
        <span>Defensible<br>Logic.</span>
      </h1>

      <div class="rule"></div>

      <div class="copy">
        Advanced systems research and development focused on verification frameworks,
        resilient architectures, and structured analysis technologies.
      </div>

      <div class="footer">
        © 2026 Hartford Logic LLC
      </div>
    </section>
  </main>
</body>
</html>
